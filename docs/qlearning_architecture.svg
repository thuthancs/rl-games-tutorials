<svg width="860" height="290" viewBox="0 0 860 290" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="860" height="290" fill="#fafafa" rx="12"/>
  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Q-Learning Architecture</text>

  <rect x="30" y="108" width="130" height="56" rx="8" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="95" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a5c">Environment</text>
  <text x="95" y="152" text-anchor="middle" font-size="11" fill="#4a90d9">state  s&#x209C;</text>

  <rect x="230" y="88" width="160" height="96" rx="8" fill="#fff7e6" stroke="#f0a500" stroke-width="1.8"/>
  <text x="310" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#7a4f00">Q-Table</text>
  <line x1="248" y1="122" x2="372" y2="122" stroke="#f0a500" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="282" y="138" text-anchor="middle" font-size="10" fill="#555">Q(s, flap)</text>
  <text x="282" y="154" text-anchor="middle" font-size="10" fill="#555">Q(s, wait)</text>
  <text x="348" y="138" text-anchor="middle" font-size="10" fill="#888">0.72</text>
  <text x="348" y="154" text-anchor="middle" font-size="10" fill="#888">0.41</text>
  <text x="310" y="173" text-anchor="middle" font-size="10" fill="#b8860b">lookup by state</text>

  <rect x="462" y="108" width="148" height="56" rx="8" fill="#eaf7ea" stroke="#3aaa35" stroke-width="1.8"/>
  <text x="536" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1a4d1a">&#x3b5;-Greedy Policy</text>
  <text x="536" y="150" text-anchor="middle" font-size="11" fill="#3aaa35">select action  a&#x209C;</text>

  <rect x="678" y="108" width="152" height="56" rx="8" fill="#fdeef3" stroke="#d44b78" stroke-width="1.8"/>
  <text x="754" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#7a0033">Bellman Update</text>
  <text x="754" y="147" text-anchor="middle" font-size="10" fill="#d44b78">Q(s,a) = Q(s,a) +</text>
  <text x="754" y="161" text-anchor="middle" font-size="10" fill="#d44b78">&#x3b1;[r + &#x3b3; max Q(s&#x2019;,a&#x2019;)]</text>

  <line x1="160" y1="136" x2="228" y2="136" stroke="#4a90d9" stroke-width="1.8" marker-end="url(#q-b)"/>
  <text x="194" y="126" text-anchor="middle" font-size="10" fill="#4a90d9">s&#x209C;</text>
  <line x1="390" y1="136" x2="460" y2="136" stroke="#f0a500" stroke-width="1.8" marker-end="url(#q-o)"/>
  <text x="425" y="126" text-anchor="middle" font-size="10" fill="#f0a500">Q-values</text>
  <line x1="610" y1="136" x2="676" y2="136" stroke="#3aaa35" stroke-width="1.8" marker-end="url(#q-g)"/>
  <text x="643" y="126" text-anchor="middle" font-size="10" fill="#3aaa35">a&#x209C;</text>
  <path d="M754 164 Q754 238 95 238 Q95 200 95 164" stroke="#d44b78" stroke-width="1.8" fill="none" marker-end="url(#q-p)" stroke-dasharray="5,3"/>
  <text x="430" y="256" text-anchor="middle" font-size="10" fill="#d44b78">s&#x209C;&#x208A;&#x2081;, r&#x209C;  (new state and reward from environment)</text>

  <defs>
    <marker id="q-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a90d9"/></marker>
    <marker id="q-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f0a500"/></marker>
    <marker id="q-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3aaa35"/></marker>
    <marker id="q-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d44b78"/></marker>
  </defs>
</svg>