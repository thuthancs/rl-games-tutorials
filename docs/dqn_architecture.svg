<svg width="920" height="380" viewBox="0 0 920 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="920" height="380" fill="#fafafa" rx="12"/>
  <text x="460" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Deep Q-Network (DQN) Architecture</text>

  <!-- ── Row 1: main loop ── -->

  <!-- Environment -->
  <rect x="20" y="100" width="120" height="56" rx="8" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="80" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a5c">Environment</text>
  <text x="80" y="144" text-anchor="middle" font-size="11" fill="#4a90d9">raw pixels</text>

  <!-- Preprocessing -->
  <rect x="186" y="100" width="128" height="56" rx="8" fill="#f0e6ff" stroke="#8e44ad" stroke-width="1.8"/>
  <text x="250" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#4a0080">Preprocessing</text>
  <text x="250" y="138" text-anchor="middle" font-size="10" fill="#8e44ad">grayscale + resize</text>
  <text x="250" y="152" text-anchor="middle" font-size="10" fill="#8e44ad">stack 4 frames</text>

  <!-- Online Network -->
  <rect x="366" y="85" width="155" height="86" rx="8" fill="#fff7e6" stroke="#f0a500" stroke-width="1.8"/>
  <text x="443" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#7a4f00">Online Network</text>
  <text x="443" y="124" text-anchor="middle" font-size="10" fill="#888">Conv1 32x8x8 s4</text>
  <text x="443" y="138" text-anchor="middle" font-size="10" fill="#888">Conv2 64x4x4 s2</text>
  <text x="443" y="152" text-anchor="middle" font-size="10" fill="#888">Conv3 64x3x3 s1</text>
  <text x="443" y="166" text-anchor="middle" font-size="10" fill="#888">FC 512  ->  Q-values</text>

  <!-- e-Greedy -->
  <rect x="574" y="100" width="130" height="56" rx="8" fill="#eaf7ea" stroke="#3aaa35" stroke-width="1.8"/>
  <text x="639" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1a4d1a">e-Greedy</text>
  <text x="639" y="142" text-anchor="middle" font-size="11" fill="#3aaa35">select action  at</text>

  <!-- Replay Buffer -->
  <rect x="756" y="100" width="144" height="56" rx="8" fill="#fdeef3" stroke="#d44b78" stroke-width="1.8"/>
  <text x="828" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#7a0033">Replay Buffer</text>
  <text x="828" y="138" text-anchor="middle" font-size="10" fill="#d44b78">store (s, a, r, s')</text>
  <text x="828" y="152" text-anchor="middle" font-size="10" fill="#d44b78">sample mini-batch</text>

  <!-- ── Row 1 arrows ── -->
  <line x1="140" y1="128" x2="184" y2="128" stroke="#4a90d9" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <line x1="314" y1="128" x2="364" y2="128" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#a-purple)"/>
  <text x="339" y="120" text-anchor="middle" font-size="10" fill="#8e44ad">4x84x84</text>
  <line x1="521" y1="128" x2="572" y2="128" stroke="#f0a500" stroke-width="1.8" marker-end="url(#a-orange)"/>
  <text x="547" y="120" text-anchor="middle" font-size="10" fill="#f0a500">Q-values</text>
  <line x1="704" y1="128" x2="754" y2="128" stroke="#3aaa35" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text x="729" y="120" text-anchor="middle" font-size="10" fill="#3aaa35">at</text>

  <!-- Feedback: Env reward back (top arc) -->
  <path d="M80 100 Q80 55 828 55 Q828 98 828 100" stroke="#4a90d9" stroke-width="1.5" fill="none" marker-end="url(#a-blue)" stroke-dasharray="5,3"/>
  <text x="454" y="46" text-anchor="middle" font-size="10" fill="#4a90d9">st+1, rt  (execute action, observe reward and next state)</text>

  <!-- ── Row 2: training ── -->

  <!-- Target Network -->
  <rect x="366" y="230" width="155" height="72" rx="8" fill="#e6f0ff" stroke="#2255cc" stroke-width="1.8"/>
  <text x="443" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#0a2080">Target Network</text>
  <text x="443" y="268" text-anchor="middle" font-size="10" fill="#2255cc">frozen copy</text>
  <text x="443" y="283" text-anchor="middle" font-size="10" fill="#2255cc">compute max Q(s', a')</text>
  <text x="443" y="298" text-anchor="middle" font-size="10" fill="#2255cc">synced every C steps</text>

  <!-- Loss -->
  <rect x="574" y="237" width="130" height="56" rx="8" fill="#fff0f0" stroke="#cc2200" stroke-width="1.8"/>
  <text x="639" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#7a0000">Loss (Huber)</text>
  <text x="639" y="274" text-anchor="middle" font-size="10" fill="#cc2200">Q(s,a) vs target</text>
  <text x="639" y="288" text-anchor="middle" font-size="10" fill="#cc2200">r + y max Q(s', a')</text>

  <!-- Optimizer -->
  <rect x="756" y="237" width="144" height="56" rx="8" fill="#f5f5f5" stroke="#555" stroke-width="1.8"/>
  <text x="828" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#222">RMSprop</text>
  <text x="828" y="274" text-anchor="middle" font-size="10" fill="#555">backprop gradients</text>
  <text x="828" y="288" text-anchor="middle" font-size="10" fill="#555">update online net</text>

  <!-- Replay Buffer down to Target Network -->
  <line x1="828" y1="156" x2="828" y2="215" stroke="#d44b78" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="828" y1="215" x2="521" y2="215" stroke="#d44b78" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="521" y1="215" x2="521" y2="237" stroke="#d44b78" stroke-width="1.5" marker-end="url(#a-pink)" stroke-dasharray="5,3"/>
  <text x="674" y="209" text-anchor="middle" font-size="10" fill="#d44b78">sample batch</text>

  <!-- Batch also feeds Target Net -->
  <line x1="443" y1="215" x2="443" y2="228" stroke="#d44b78" stroke-width="1.5" marker-end="url(#a-pink)" stroke-dasharray="5,3"/>

  <!-- Target Net to Loss -->
  <line x1="521" y1="265" x2="572" y2="265" stroke="#2255cc" stroke-width="1.8" marker-end="url(#a-darkblue)"/>
  <text x="547" y="257" text-anchor="middle" font-size="10" fill="#2255cc">target Q</text>

  <!-- Loss to Optimizer -->
  <line x1="704" y1="265" x2="754" y2="265" stroke="#cc2200" stroke-width="1.8" marker-end="url(#a-red)"/>

  <!-- Optimizer back to Online Net (left loop) -->
  <path d="M756 265 Q720 265 720 200 Q720 128 521 128" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a-grey)" stroke-dasharray="5,3"/>
  <text x="725" y="193" text-anchor="middle" font-size="10" fill="#555">update weights</text>

  <!-- Online Net periodic copy to Target Net -->
  <path d="M366 155 Q330 155 330 266 Q330 290 364 280" stroke="#f0a500" stroke-width="1.5" fill="none" marker-end="url(#a-orange)" stroke-dasharray="4,3"/>
  <text x="304" y="222" text-anchor="middle" font-size="10" fill="#f0a500" transform="rotate(-90 304 222)">copy every C steps</text>

  <defs>
    <marker id="a-blue"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a90d9"/></marker>
    <marker id="a-purple"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/></marker>
    <marker id="a-orange"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f0a500"/></marker>
    <marker id="a-green"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3aaa35"/></marker>
    <marker id="a-pink"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d44b78"/></marker>
    <marker id="a-darkblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2255cc"/></marker>
    <marker id="a-red"     markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#cc2200"/></marker>
    <marker id="a-grey"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
  </defs>
</svg>
